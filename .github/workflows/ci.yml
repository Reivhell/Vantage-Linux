name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build and test
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check shell and frontend syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          for file in frontend/js/*.js; do
            node --input-type=module --check < "$file"
          done

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Cargo test
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Smoke test release binaries
        run: |
          test -x target/release/vantage-linux
          test -x target/release/vantage-helper
          timeout 60s ./target/release/vantage-linux --discover > /tmp/vantage-discover.json
          timeout 60s ./target/release/vantage-linux --selftest > /tmp/vantage-selftest.json
          python3 - <<'PY'
          import json

          for path in ("/tmp/vantage-discover.json", "/tmp/vantage-selftest.json"):
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
              assert data, f"{path} is empty"
          PY
